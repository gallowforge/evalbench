[project]
name = "evalbench"
version = "1.3.0"
description = "A self-hosted LLM evaluation workbench: tasks and rubrics, local and API models, automatic checks, blind pairwise rating, scoreboards and regression tracking."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Ali Husain" }]
keywords = ["llm", "evaluation", "evals", "benchmark", "rlhf", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=2.0",
  "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
evalbench = "evalbench.cli:main"

[project.urls]
Homepage = "https://github.com/gallowforge/evalbench"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalbench"]
artifacts = ["evalbench/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
