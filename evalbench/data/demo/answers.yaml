d03-binary-search:
  - id: good
    q: 3
    note: changes lo = mid to lo = mid + 1 and says why the loop stalled
    text: |
      When `hi = lo + 1` and `items[mid] < target`, `lo = mid` leaves `lo` unchanged, so the loop never ends. Move past `mid`:

      ```python
      def first_index(items, target):
          lo, hi = 0, len(items) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              if items[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid
          return lo if items and items[lo] == target else -1
      ```
  - id: bisect
    q: 3
    note: replaces it with bisect_left, which is correct and simpler
    text: |
      ```python
      from bisect import bisect_left

      def first_index(items, target):
          i = bisect_left(items, target)
          return i if i < len(items) and items[i] == target else -1
      ```
  - id: wrong
    q: 0
    note: changes hi instead of lo, so it still hangs
    flags: [factual_error]
    text: |
      ```python
      def first_index(items, target):
          lo, hi = 0, len(items) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              if items[mid] < target:
                  lo = mid
              else:
                  hi = mid - 1
          return lo if items and items[lo] == target else -1
      ```

d04-durations:
  - id: good
    q: 3
    note: accumulates digits into a number before each unit letter
    text: |
      `text[i - 1]` only reads one digit. Accumulate the number instead:

      ```python
      def parse_duration(text):
          units = {"h": 3600, "m": 60, "s": 1}
          total, number = 0, ""
          for ch in text:
              if ch.isdigit():
                  number += ch
              elif ch in units:
                  total += int(number) * units[ch]
                  number = ""
          return total
      ```
  - id: regex
    q: 3
    note: parses value-unit pairs with a regex, which handles every case
    text: |
      ```python
      import re

      def parse_duration(text):
          units = {"h": 3600, "m": 60, "s": 1}
          return sum(int(n) * units[u] for n, u in re.findall(r"(\d+)([hms])", text))
      ```
  - id: wrong
    q: 0
    note: reads two characters before each unit, which breaks single digits
    flags: [factual_error]
    text: |
      ```python
      def parse_duration(text):
          units = {"h": 3600, "m": 60, "s": 1}
          total = 0
          for i, ch in enumerate(text):
              if ch in units:
                  total += int(text[i - 2:i]) * units[ch]
          return total
      ```

