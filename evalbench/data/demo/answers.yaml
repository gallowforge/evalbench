r03-seating:
  - id: full
    q: 3
    note: tests both places for Ben, rules each one out cleanly and finds Dev, Ben, Ana, Chloe
    text: |
      Ben must be in chair 2 or 3.

      - Ben in 3: Dev is in 2 or 4. Ana and Chloe need two adjacent free chairs with Ana on the left. Dev in 4 leaves chairs 1 and 2, but Ana cannot be in chair 1. Dev in 2 leaves 1 and 4, which are not adjacent. No solution.
      - Ben in 2: Dev is in 1 or 3. Dev in 3 leaves 1 and 4, not adjacent. Dev in 1 leaves 3 and 4: Ana 3, Chloe 4. This works.

      The row is Dev, Ben, Ana, Chloe.

      Answer: Dev
  - id: brief
    q: 3
    note: gives the full arrangement and why the other placement fails
    text: |
      Ben in chair 3 fails (Ana would have to take chair 1), so Ben is in 2, Dev in 1, Ana in 3 and Chloe in 4.

