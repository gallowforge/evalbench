d01-window:
  - id: good
    q: 3
    note: fixes the range to len(values) - window + 1 and explains the off-by-one
    text: |
      The loop stops one window early: there are `len(values) - window + 1` full windows, not `len(values) - window`.

      ```python
      def moving_average(values, window):
          averages = []
          for i in range(len(values) - window + 1):
              chunk = values[i:i + window]
              averages.append(sum(chunk) / window)
          return averages
      ```
  - id: good2
    q: 3
    note: rewrites it as a comprehension with the corrected bound
    text: |
      ```python
      def moving_average(values, window):
          return [sum(values[i:i + window]) / window
                  for i in range(len(values) - window + 1)]
      ```
      The range needs `+ 1` so the last full window is included.
  - id: partial
    q: 0
    note: changes the slice instead of the range, so windows run off the end
    flags: [factual_error]
    text: |
      The slice should include one more value:

      ```python
      def moving_average(values, window):
          averages = []
          for i in range(len(values) - window):
              chunk = values[i:i + window + 1]
              averages.append(sum(chunk) / window)
          return averages
      ```

