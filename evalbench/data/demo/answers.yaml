r06-sevens:
  - id: full
    q: 3
    note: counts the complement (728 numbers with no 7) and subtracts from 999
    text: |
      Count the numbers from 1 to 999 with no 7 and subtract.
      Treat each as three digits from 000 to 999: 9 choices per digit gives 9³ = 729 strings with no 7, including 000.
      So 728 numbers from 1 to 999 have no 7, and 999 − 728 = 271 have at least one.

      Answer: 271
  - id: brief
    q: 3
    note: uses 1000 − 9³ = 271 and notes that 000 is not a 7 anyway
    text: |
      Of the 1,000 three-digit strings 000 to 999, 9³ = 729 contain no 7, so 271 do; 000 has no 7, so all 271 are positive.

      Answer: 271
  - id: overlap
    q: 0
    note: adds 100 + 100 + 100 and double counts the overlaps
    flags: [factual_error]
    text: |
      A 7 can be in the hundreds, tens or units place, and each place has 100 numbers with a 7 there, so 300.

      Answer: 300

r07-clock:
  - id: full
    q: 3
    note: moves the hour hand a quarter of the way to 4 and gets 7.5 degrees
    text: |
      The minute hand at 15 minutes points at 90°.
      The hour hand moves 30° per hour, and at a quarter past it has gone a quarter of the way from 3 to 4: 90° + 7.5° = 97.5°.
      The angle between them is 7.5°.

      Answer: 7.5
  - id: brief
    q: 3
    note: notes the hour hand drifts 0.5 degrees a minute and gets 7.5
    text: |
      The hour hand drifts 0.5° per minute, so at 3:15 it is 7.5° past the 3, where the minute hand points.

      Answer: 7.5
  - id: zero
    q: 0
    note: assumes both hands point at the 3 and answers 0
    flags: [factual_error]
    text: |
      At 3:15 the minute hand points at the 3, and so does the hour hand, so they overlap.

      Answer: 0

