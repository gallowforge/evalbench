r01-ages:
  - id: full
    q: 3
    note: sets up 3t + 12 = 2(t + 12), gets 36 and checks it against both conditions
    text: |
      Let Teo's age be t, so Mira is 3t.

      In 12 years: 3t + 12 = 2(t + 12)
      3t + 12 = 2t + 24
      t = 12

      Mira is 3 × 12 = 36. Check: in 12 years she is 48 and Teo is 24, exactly twice his age.

      Answer: 36
  - id: brief
    q: 3
    note: solves it in two clean lines and lands on 36
    text: |
      Teo = t, Mira = 3t. Then 3t + 12 = 2(t + 12), so t = 12 and Mira is 36.

      Answer: 36
  - id: terse
    q: 2
    note: gives 36 with no working at all
    text: "Answer: 36"
  - id: slip
    q: 0
    note: slips in the algebra (t = 8) and answers 24
    flags: [factual_error]
    text: |
      Let Teo be t, so Mira is 3t. In 12 years Mira is twice Teo: 3t + 12 = 2(t + 12), which gives t = 8.

      So Mira is 3 × 8 = 24.

      Answer: 24

