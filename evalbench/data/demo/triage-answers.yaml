    text: |
      {"category": "account", "urgency": "normal", "reply": "Happy to help, Priya. For security you make this change yourself: go to Settings > Security, choose Change email and enter priya@example.net. We'll send a confirmation link to the new address, and once you click it you sign in with that one. Your invoices and clients stay exactly as they are."}
  - id: plain
    q: 2
    note: points to the right page in stock phrases
    text: |
      {"category": "account", "urgency": "normal", "reply": "Thank you for your message. You can change your sign-in email under Settings > Security. A confirmation link will be sent to the new address."}
  - id: curt
    q: 1
    note: names the page and nothing else
    text: |
      {"category": "account", "urgency": "normal", "reply": "Change it under Settings > Security."}
  - id: missing-field
    q: 0
    note: leaves the urgency out of the JSON
    flags: [formatting, incomplete]
    text: |
      {"category": "account", "reply": "You can change your sign-in email under Settings > Security. We will send a confirmation link to the new address."}
  - id: wrong-category
    q: 1
    note: gives a fine answer but files an account change under how-to
    flags: [factual_error]
    text: |
      {"category": "how-to", "urgency": "normal", "reply": "Hi Priya. Go to Settings > Security, choose Change email and enter your new address. We'll send a confirmation link there, and once you click it you sign in with the new one."}

