# Scripted answers for the support triage demo. The demo models are fictional; triage-plan.yaml says
# which variant each one gives in each run, and the real check engine grades whatever it picked.
#   q     how a careful human would rate it: 3 strong, 2 correct but thin, 1 weak, 0 wrong
#   note  what a rater would say about it, used to write the demo justifications
#   flags issues a rater would tick

r01-charged-twice:
  - id: warm
    q: 3
    note: names both charges and the date, says who is reviewing them and when to expect an answer
    text: |
      {"category": "billing", "urgency": "high", "reply": "Sorry about that, Dana. Two payments a minute apart on one account should not happen. I've flagged both charges of 19.00 from the 3rd to our billing team as urgent. They will review them and email you, usually within one working day. You don't need to do anything in the meantime."}
  - id: plain
    q: 2
    note: gets it to the billing team but reads like a form letter
    text: |
      {"category": "billing", "urgency": "high", "reply": "Thank you for contacting us. We are sorry for the inconvenience. Your report of a duplicate charge has been passed to our billing team, who will review it and contact you by email."}
  - id: curt
    q: 1
    note: has the right labels but gives the customer seven cold words
    text: |
      {"category": "billing", "urgency": "high", "reply": "Passed to the billing team for review."}
  - id: promises-refund
    q: 0
    note: tells the customer a refund has been issued, which only the billing team can decide
    flags: [ignores_constraint]
    text: |
      {"category": "billing", "urgency": "high", "reply": "Sorry about that, Dana. I can see the duplicate payment from the 3rd, and I've issued a refund for the second 19.00. It should reach your bank in three to five working days."}
  - id: wrong-urgency
    q: 1
    note: writes a good reply but files a double charge as normal urgency
    flags: [factual_error]
    text: |
      {"category": "billing", "urgency": "normal", "reply": "Sorry about that, Dana. I've sent both charges of 19.00 from the 3rd to our billing team. They will review them and email you once they have checked your account."}

r02-blank-pdf:
  - id: warm
    q: 3
    note: explains where the fault is and gives a way to get the PDF today
    text: |
      {"category": "bug", "urgency": "normal", "reply": "Thanks for the clear report. Blank PDFs while the preview and email still work point to a fault in our download step, not in your invoices. I've logged it for our engineers with those details. Until it's fixed, you can email an invoice to yourself and save the attached PDF from there."}
  - id: plain
    q: 2
    note: confirms the bug is logged but offers nothing to do in the meantime
    text: |
      {"category": "bug", "urgency": "normal", "reply": "Thank you for reporting this issue. We have logged the problem with blank PDF downloads and our engineers will investigate. We will update you when it is resolved."}
  - id: curt
    q: 1
    note: has the right labels and almost no reply
    text: |
      {"category": "bug", "urgency": "normal", "reply": "Logged as a bug. We'll look into it."}
  - id: fenced
    q: 2
    note: confirms the bug is logged, with a sentence of preamble and a code fence around the JSON
    text: |
      Here is the triage for this ticket:

      ```json
      {
        "category": "bug",
        "urgency": "normal",
        "reply": "Thank you for reporting this issue. We have logged the problem with blank PDF downloads and our engineers will investigate. We will update you when it is resolved."
      }
      ```
  - id: wrong-category
    q: 1
    note: treats a broken download as a how-to question and explains where the button is
    flags: [factual_error]
    text: |
      {"category": "how-to", "urgency": "normal", "reply": "To download an invoice, open it and choose Download PDF at the top right. If the page comes out blank, try a different browser or clear your cache, then download it again."}
  - id: not-json
    q: 0
    note: writes a friendly paragraph and no JSON at all
    flags: [formatting, ignores_constraint]
    text: |
      Hi there! Sorry to hear your PDFs are coming out blank. Since the preview and the emails still work, this sounds like a bug on our side, so I'm passing it on to our engineers as a normal-priority issue. In the meantime you could email the invoice to yourself and save the attachment. Let me know if that helps!

r03-change-email:
