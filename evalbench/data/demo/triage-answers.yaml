    q: 3
    note: is kind about the mistake, honest that it cannot promise a refund and clear about what happens next
    text: |
      {"category": "billing", "urgency": "normal", "reply": "I understand, Leona, a renewal you meant to cancel is frustrating. I can't promise a refund myself, because only our billing team decides those. I've sent them your request with the renewal date and a note that you haven't used the plan since. They will review it and email you their answer."}
  - id: plain
    q: 2
    note: keeps to the rule in three stiff sentences
    text: |
      {"category": "billing", "urgency": "normal", "reply": "Thank you for contacting us. Refund requests are decided by our billing team. Your request has been forwarded, and they will review it and contact you."}
  - id: curt
    q: 1
    note: forwards the request without a word to the customer about what to expect
    text: |
      {"category": "billing", "urgency": "normal", "reply": "Sent to the billing team for review."}
  - id: promises-refund
    q: 0
    note: promises the full 190.00 back, which it has no right to promise
    flags: [ignores_constraint]
    text: |
      {"category": "billing", "urgency": "normal", "reply": "No problem, Leona. Since the plan renewed only yesterday and you haven't used it, I've asked our billing team to cancel it, and you will be refunded the full 190.00 within five working days."}
  - id: wrong-urgency
    q: 1
    note: stays within the rules but treats a correct renewal charge as high urgency
    flags: [factual_error]
    text: |
      {"category": "billing", "urgency": "high", "reply": "I understand, Leona. I can't promise a refund myself, because only our billing team decides those. I've sent them your request as urgent with the renewal date, and they will review it and email you."}
  - id: too-long
    q: 1
    note: keeps to the rule but needs about ninety words to say so
    flags: [verbose, ignores_constraint]
    text: |
      {"category": "billing", "urgency": "normal", "reply": "I completely understand, Leona, and I am sorry about the surprise. Forgetting a renewal date happens to everyone, and seeing 190.00 leave your account when you meant to cancel is frustrating. I am not able to promise or confirm a refund myself, because those decisions are made only by our billing team. What I have done is send them your request, together with the renewal date and the fact that you have not used the plan since. They will review it carefully and email you their answer."}

