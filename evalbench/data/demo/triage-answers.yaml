r08-double-reminders:
  - id: warm
    q: 3
    note: owns the fault, gives a way to stop the duplicates today and promises an update
    text: |
      {"category": "bug", "urgency": "normal", "reply": "Sorry, Marek, I understand that's awkward in front of clients. With only one reminder rule set up, two emails seconds apart is a fault on our side. I've passed it to our engineers with your account details. To stop the duplicates today, you can pause the rule under Settings > Reminders. I'll write again when it's fixed."}
  - id: plain
    q: 2
    note: logs the bug politely and leaves the customer with nothing to do
    text: |
      {"category": "bug", "urgency": "normal", "reply": "Thank you for reporting this. We are sorry for the inconvenience. The duplicate reminder issue has been logged and our engineers will investigate."}
  - id: curt
    q: 1
    note: says it is logged in four words
    text: |
      {"category": "bug", "urgency": "normal", "reply": "Logged. Engineers will check."}
  - id: fenced
    q: 2
    note: logs the bug politely, inside a preamble and a code fence
    text: |
      Here is the triage result:

      ```json
      {
        "category": "bug",
        "urgency": "normal",
        "reply": "Thank you for reporting this. We are sorry for the inconvenience. The duplicate reminder issue has been logged and our engineers will investigate."
      }
      ```
  - id: wrong-urgency
    q: 1
    note: handles the bug well but rates double reminders as high urgency
    flags: [factual_error]
    text: |
      {"category": "bug", "urgency": "high", "reply": "Sorry, Marek. With only one reminder rule, two emails seconds apart is a fault on our side, and I've passed it to our engineers. Until it's fixed you can pause the rule under Settings > Reminders."}
  - id: too-long
    q: 1
    note: says the right things but runs a third over the allowed length
    flags: [verbose, ignores_constraint]
    text: |
      {"category": "bug", "urgency": "normal", "reply": "I am very sorry about this, Marek, and I completely understand that it is embarrassing when clients receive the same reminder twice. Since you have only one reminder rule, the duplicate emails are almost certainly caused by a fault on our side and not by anything you did. I have logged the problem for our engineers together with your account details. Until it is fixed, you can pause the rule under Settings > Reminders so that no more duplicates go out."}

