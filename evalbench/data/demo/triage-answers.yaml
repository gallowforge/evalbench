    text: |
      {"category": "billing", "urgency": "normal", "reply": "Of course. Add your company tax number under Settings > Billing, in the Receipt details box. Once it's saved, every receipt on that page, including March, can be downloaded again with the number on it. If the March one still comes out without it, reply here and our billing team will send a corrected copy."}
  - id: plain
    q: 2
    note: gives the right page in a flat, generic way
    text: |
      {"category": "billing", "urgency": "normal", "reply": "Thank you for contacting us. You can add your tax number under Settings > Billing. Receipts downloaded after that will include it."}
  - id: curt
