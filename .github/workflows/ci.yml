name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check evalbench tests
      - name: Unit and API tests
        run: pytest
      - name: Validate bundled suites
        run: evalbench validate evalbench/data/suites/*.yaml examples/*.yaml

  web:
    name: Web app and end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e ..
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the built app
        run: npx playwright test
      - name: Build the static demo
        run: npm run build:demo
      - name: Smoke test the static demo
        run: npm run e2e:demo

  docker:
    name: Docker image and compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t ghcr.io/gallowforge/evalbench:latest .
      - name: Start the stack
        env:
          EVALBENCH_USERNAME: ci-owner
          EVALBENCH_PASSWORD: ci-only-password
        run: docker compose up -d --wait
      - name: Sign-in, sandbox isolation, and a full demo load through the sandbox container
        run: |
          set -e
          curl -fsS http://localhost:8484/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8484/api/suites)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d '{"username":"someone","password":"ci-only-password"}' http://localhost:8484/api/auth/login)" = 401
          curl -fsS -c jar -H 'content-type: application/json' -d '{"username":"ci-owner","password":"ci-only-password"}' http://localhost:8484/api/auth/login
          curl -fsS -b jar http://localhost:8484/api/meta | python3 -c "import sys,json; m=json.load(sys.stdin); assert m['sandbox']=={'mode':'container','ok':True}, m['sandbox']"
          curl -fsS -b jar -X POST http://localhost:8484/api/demo
          curl -fsS -b jar http://localhost:8484/api/overview | python3 -c "import sys,json; d=json.load(sys.stdin); c=d['counts']; assert c['runs']==9 and c['answers']==820, c; print(c)"
          docker compose exec -T evalbench python - <<'PY'
          import httpx
          def run(code):
              return httpx.post("http://sandbox:8485/run", json={"code": code, "timeout": 5}, timeout=30).json()
          r = run("import socket; socket.create_connection(('1.1.1.1', 80), timeout=3)")
          assert r["exit_code"] != 0, r
          print("sandbox has no route out")
          r = run("import urllib.request; urllib.request.urlopen('http://evalbench:8484/api/health', timeout=3)")
          assert r["exit_code"] != 0 and "403" in r["stderr"], r
          print("the app refuses the sandbox")
          r = run("import os; print(os.getuid())")
          assert r["stdout"].strip().startswith("610"), r
          print("each execution runs as its own user:", r["stdout"].strip())
          PY
      - name: Logs
        if: failure()
        run: docker compose logs
