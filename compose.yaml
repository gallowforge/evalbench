# Evalbench: the app, plus a locked-down sandbox for running model-written code.
#   docker compose up -d      then open http://localhost:8484 and create the owner account
# Put API keys in a .env file next to this one (see .env.example). They are read at call
# time and never written to the database, logs or exports.
name: evalbench

services:
  evalbench:
    image: ghcr.io/gallowforge/evalbench:latest
    container_name: evalbench
    restart: unless-stopped
    ports:
      # This machine only. To reach it from your network, use "8484:8484" (sign-in stays on).
      - "127.0.0.1:8484:8484"
    volumes:
      - evalbench-data:/data
    environment:
      EVALBENCH_SANDBOX_URL: http://sandbox:8485
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EVALBENCH_USERNAME: ${EVALBENCH_USERNAME:-}
      EVALBENCH_PASSWORD: ${EVALBENCH_PASSWORD:-}
      EVALBENCH_DEMO: ${EVALBENCH_DEMO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach LM Studio or Ollama running on this machine
    networks: [default, sandbox]
    depends_on:
      sandbox:
        condition: service_healthy

  sandbox:
    image: ghcr.io/gallowforge/evalbench:latest
    command: ["evalbench", "sandbox"]
    restart: unless-stopped
    # The service starts as root only to hand each execution its own unprivileged user;
    # it keeps no other capability.
    user: "0:0"
    environment:
      EVALBENCH_SANDBOX_SLOTS: "2"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    networks: [sandbox] # internal only: no route to the internet or your LAN
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8485/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 5s

networks:
  sandbox:
    internal: true

volumes:
  evalbench-data:
